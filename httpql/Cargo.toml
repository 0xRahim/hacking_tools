[package]
name = "httpql"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
memchr = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# This tool streams multi-GB log files, so make `cargo run` (dev profile)
# usable on large inputs instead of being ~15x slower than release.
[profile.dev]
opt-level = 2
